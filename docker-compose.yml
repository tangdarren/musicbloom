# Local demo stack for MusicBloom.
# API on http://127.0.0.1:8000 and production frontend on http://127.0.0.1:8080

services:
  api:
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      MUSICBLOOM_DEMO_MODE: "true"
      MUSICBLOOM_DEBUG: "false"
      MUSICBLOOM_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: frontend-runtime
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
